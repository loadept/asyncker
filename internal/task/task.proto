syntax = "proto3";

package task;

option go_package = "loadept.com/pkg/asyncker/internal/task";

import "google/protobuf/empty.proto";

enum TaskStatus {
    TASK_STATUS_RUNNING     = 0;
    TASK_STATUS_SUCCEEDED   = 1;
    TASK_STATUS_CANCELLED   = 2;
    TASK_STATUS_FAILED      = 3;
}

message Task {
    string name = 2;
    string command = 3;
    repeated string args = 4;
    int64 pid = 5;
    TaskStatus status = 6;
    int64 executed_at = 7;
    uint64 mem_usage = 8;
    uint32 num_threads = 9;
}

message InvokeTaskRequest {
    string command = 1;
    repeated string args = 2;
    optional string name = 3;
    string working_dir = 4;
    map<string, string> env_vars = 5;
}

message InvokeTaskResponse {
    Task task = 1;
}

message ListTasksResponse {
    repeated Task tasks = 1;
}

message StopTaskRequest {
  string name = 1;
}

message StopTaskResponse {
  bool stopped = 1;
  string via = 2;
  Task task = 3;
}

service TaskService {
    rpc InvokeTask (InvokeTaskRequest) returns (InvokeTaskResponse);
    rpc ListTasks (google.protobuf.Empty) returns (ListTasksResponse);
    rpc StopTask (StopTaskRequest) returns (StopTaskResponse);
}
