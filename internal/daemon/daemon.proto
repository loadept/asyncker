syntax = "proto3";

package daemon;

option go_package = "loadept.com/go/asyncker/internal/daemon";

import "google/protobuf/empty.proto";


message StatusResponse {  
    bool running = 1;
    int64 pid = 2;
    string uptime = 3;
}


service DaemonService {
    rpc StopDaemon (google.protobuf.Empty) returns (google.protobuf.Empty);
    rpc DaemonStatus (google.protobuf.Empty) returns (StatusResponse);
}
